<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Placement Test – Ms Ikram Boudaoud</title>
<style>
:root{--cream:#d7c695;--paper:#efe6c8;--gold:#d8a731;--pine:#26321f;--ink:#1f1f1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--ink);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif}
header{background:var(--pine);color:var(--cream);text-align:center;padding:22px 16px 18px;border-bottom:4px solid var(--gold)}
header img{height:104px;width:auto;display:block;margin:0 auto 10px}
header h1{font-size:1.5rem;margin:6px 0 2px;color:var(--gold)}
header p{margin:2px 0;font-size:.95rem}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--paper);border-radius:14px;padding:20px;margin-bottom:16px}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--cream);margin:4px 0 12px;font-family:system-ui,sans-serif;font-size:.95rem}
.prog{height:6px;background:var(--pine);border-radius:3px;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:3px}
.tm{background:var(--gold);color:var(--ink);padding:3px 12px;border-radius:20px;font-weight:700}
h2{margin:0 0 8px;color:var(--pine)}
.text{background:var(--cream);padding:14px;border-radius:10px;border-left:5px solid var(--pine)}
.q{margin:18px 0}.q p{margin:0 0 6px}
label.o{display:block;border:2px solid var(--cream);background:#f7f0da;border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;font-family:system-ui,sans-serif;font-size:.97rem}
label.o:has(input:checked){background:var(--gold);border-color:var(--pine);font-weight:600}
label.o:has(input:focus-visible){outline:3px solid var(--pine)}
label.o input{margin-right:8px;accent-color:var(--pine)}
input[type=text],input[type=email],textarea{width:100%;padding:11px;border:2px solid var(--cream);border-radius:10px;font:inherit;background:#f7f0da;margin:4px 0 12px}
textarea{min-height:140px}
.btn{background:var(--pine);color:var(--cream);border:0;padding:12px 22px;border-radius:10px;font:600 1rem system-ui,sans-serif;cursor:pointer}
.btn.g{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
a.btn{display:inline-block;text-decoration:none}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sc{font-size:2.6rem;color:var(--pine);margin:6px 0}
.note{font-family:system-ui,sans-serif;font-size:.9rem;color:#4a4636}.tr{font-family:system-ui,sans-serif;font-size:.82rem;color:#6b6249;margin:7px 0;line-height:1.55}.tr[lang=ar]{direction:rtl;text-align:right}
@media(prefers-reduced-motion:no-preference){.card{animation:in .3s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style><script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script></head><body>

function stopSpeech(){try{if(S.au)S.au.pause()}catch(e){}}
function speak(a,btn){
 const n=S.plays[a]||0;if(n>=2)return;S.plays[a]=n+1;stopSpeech();
 const au=new Audio(AUD[a]);S.au=au;btn.textContent="Playing…";btn.disabled=true;
 const end=()=>{btn.disabled=S.plays[a]>=2;btn.textContent=S.plays[a]>=2?"No plays left":"▶ Play again ("+(2-S.plays[a])+" left)"};
 au.onended=end;au.onerror=end;au.play().catch(end);
}
function submitResults(btn,msgEl){
 btn.disabled=true;msgEl.textContent="Sending your results…";
 fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"English Placement Test – "+S.name,from_name:S.name,name:S.name,email:S.email,message:resText()})})
 .then(r=>r.json()).then(d=>{if(d&&d.success){btn.textContent="Sent ✓";msgEl.textContent="Your results were sent to your teacher.";}else{btn.disabled=false;btn.textContent="Retry submit";msgEl.textContent="Could not send automatically. Press “Retry submit”, or copy your results and email them to "+TEACHER_EMAIL+".";}})
 .catch(()=>{btn.disabled=false;btn.textContent="Retry submit";msgEl.textContent="Could not send automatically. Press “Retry submit”, or copy your results and email them to "+TEACHER_EMAIL+".";});
}
function resText(){
 const sc=ALLQ.filter(q=>S.ans[q[0]]===q[3]).length;
 const band=sc<=8?"A1":sc<=16?"A2":"A2+ / B1 candidate";
 return "English Placement Test – Ms Ikram Boudaoud\nName: "+S.name+"\nEmail: "+S.email+"\nAuto score: "+sc+"/19 ("+band+")\nAnswers: "+ALLQ.map(q=>q[0]+"="+(S.ans[q[0]]===undefined?"-":"ABC"[S.ans[q[0]]])).join(" ")+"\nWriting: "+(S.w||"(none)")+"\nSpeaking (auto-transcript): "+(S.speech||"(none)");
}
function printSummary(){
 const sc=ALLQ.filter(q=>S.ans[q[0]]===q[3]).length;
 const band=sc<=8?"A1":sc<=16?"A2":"A2+ / B1 candidate";
 const rows=ALLQ.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q[1])}</td><td>${S.ans[q[0]]===undefined?"–":"ABC"[S.ans[q[0]]]}</td></tr>`).join("");
 const html=`<!doctype html><html><head><meta charset="utf-8"><title>Placement Test – ${esc(S.name)}</title><style>body{font:15px/1.5 Georgia,serif;color:#1f1f1d;max-width:720px;margin:24px auto;padding:0 20px}h1{font-size:1.5rem;margin:0}h2{color:#26321f;font-size:1.1rem;margin:18px 0 6px}p{margin:4px 0}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}th,td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}th{background:#26321f;color:#efe6c8}.head{text-align:center;border-bottom:3px solid #d8a731;padding-bottom:10px;margin-bottom:4px}.muted{color:#666}</style></head><body><div class="head"><h1>English Placement Test</h1><p class="muted">Ms Ikram Boudaoud — Faculty of Medicine Dr. B. Benzerdjeb, Tlemcen</p></div><h2>Student</h2><p><b>Name:</b> ${esc(S.name)}</p><p><b>Email:</b> ${esc(S.email)}</p><p><b>Date:</b> ${new Date().toLocaleString()}</p><h2>Score</h2><p><b>${sc} / 19</b> — Estimated level: <b>${band}</b></p><h2>Answers</h2><table><thead><tr><th>#</th><th>Question</th><th>Answer</th></tr></thead><tbody>${rows}</tbody></table><h2>Writing</h2><p>${esc(S.w||"(none)")}</p><h2>Speaking (auto-transcript)</h2><p>${esc(S.speech||"(none)")}</p><p class="muted" style="margin-top:24px">Generated automatically by the English Placement Test.</p></body></html>`;
 const w=window.open("","_blank");
 if(!w){alert("Your browser blocked the print window. Use the Copy button instead.");return;}
 w.document.open();w.document.write(html);w.document.close();
 setTimeout(()=>{try{w.focus();w.print()}catch(e){}},300);
}
function render(){
 clearInterval(S.t);const p=P[S.p];let h="";
 if(p=="welcome"){
  h=`<div class="card"><h2>Welcome</h2><p>This short test checks your level of English. It has four parts: reading, listening, writing, and speaking. It takes about 12 minutes. Answer as best you can.</p>
  <p class="tr" lang="fr">Ce court test évalue votre niveau d’anglais. Il comporte quatre parties : lecture, écoute, écriture et expression orale. Il dure environ 12 minutes. Répondez du mieux que vous pouvez.</p>
  <p class="tr" lang="ar" dir="rtl">هذا الاختبار القصير يحدد مستواك في اللغة الإنجليزية. يتكوّن من أربعة أجزاء: القراءة، والاستماع، والكتابة، والمحادثة. يستغرق حوالي 12 دقيقة. أجب بأفضل ما تستطيع.</p>
  <label for="nm">Full name</label><input type="text" id="nm" value="${esc(S.name)}" autocomplete="name">
  <label for="em">Email</label><input type="email" id="em" value="${esc(S.email)}" autocomplete="email">
  <p class="note">Each audio can be played twice. For the speaking part, allow your microphone when asked.</p>
  <p class="note">Your results will be sent automatically to your teacher when you finish the test.</p>
  <button class="btn g" id="go">Start the test</button></div>`;
  app.innerHTML=h;
  document.getElementById("go").onclick=()=>{S.name=document.getElementById("nm").value.trim();S.email=document.getElementById("em").value.trim();if(!S.name){document.getElementById("nm").focus();return}next()};
  return}
 if(p=="result"){
  const sc=ALLQ.filter(q=>S.ans[q[0]]===q[3]).length;
  const band=sc<=8?"A1":sc<=16?"A2":"A2+ / B1 candidate";
  app.innerHTML=`<div class="card"><h2>Last step, ${esc(S.name)}</h2><p>Reading and listening score:</p><div class="sc">${sc} / 19</div><p>Estimated level: <b>${band}</b></p>
  <p>Your teacher will assess your writing and speaking to confirm your final level.</p>
  <p class="note"><b>Your speaking transcript (sent to your teacher):</b></p><div class="text">${esc(S.speech)||"(none)"}</div>
  <div class="row"><button class="btn g" id="sb">Submit my results</button><button class="btn" id="cp">Copy my results</button><button class="btn" id="pr">Print summary</button></div>
  <p class="note" id="msg">Press “Submit my results” to send everything to your teacher.</p>
  <textarea id="ta" hidden readonly></textarea></div>`;
  const msg=document.getElementById("msg"),sb=document.getElementById("sb");
  sb.onclick=()=>submitResults(sb,msg);
  document.getElementById("cp").onclick=()=>{const ta=document.getElementById("ta");
   const show=()=>{ta.hidden=false;ta.value=resText();ta.select();msg.textContent="Copy the text below and send it to "+TEACHER_EMAIL+"."};
   try{navigator.clipboard.writeText(resText()).then(()=>msg.textContent="Copied. Now paste it in a message to your teacher.",show)}catch(e){show()}};
  document.getElementById("pr").onclick=printSummary;
  submitResults(sb,msg);
  return}
 S.left=TT[p];
 if(p=="reading")h=`<div class="card"><h2>Read the text, then answer</h2><div class="text">${READ_TXT}</div>${mcq(R)}<button class="btn" id="nx">Next part</button></div>`;
 if(p=="listening")h=`<div class="card"><h2>Listen, then answer</h2><p class="note">If no sound plays, check that your volume is on.</p>${A.map((a,i)=>`<div class="q"><button class="btn g" data-a="${i}">▶ Play audio ${i+1} (2 plays)</button>${mcq(a.qs)}</div>`).join("")}<button class="btn" id="nx">Next part</button></div>`;
 if(p=="writing")h=`<div class="card"><h2>Write 3 to 5 sentences</h2><p>Say your name, your job, where you work, and one thing you do in your free time. (Maximum 60 words)</p><textarea id="wr">${esc(S.w)}</textarea><p class="note" id="wc">0 / 60 words</p><button class="btn" id="nx">Next part</button></div>`;
 if(p=="speaking")h=`<div class="card"><h2>Introduce yourself</h2><p>You have 15 seconds to prepare. Then speak for 30 to 45 seconds.</p><p class="note">Your speech will be turned into text and sent to your teacher. You can also listen to and download your recording.</p><button class="btn g" id="rc">Start</button> <button class="btn" id="st" disabled>Stop recording</button><p class="note" id="rs"></p><p class="note" id="live"></p><audio id="pl" controls hidden></audio><br><a class="btn" id="dl" hidden download>Download recording</a><div class="text" id="tr" hidden></div><textarea id="alt" hidden placeholder="Your microphone is not available. Type your introduction here."></textarea><br><button class="btn" id="nx">Finish test</button></div>`;
 app.innerHTML=bar()+h;
 S.t=setInterval(()=>{S.left--;const e=document.getElementById("tm");if(e)e.textContent=fmt(Math.max(S.left,0));if(S.left<=0)next()},1000);
 document.getElementById("nx").onclick=next;
 document.querySelectorAll("input[type=radio]").forEach(r=>r.onchange=()=>S.ans[r.name]=+r.value);
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>speak(+b.dataset.a,b));
 const wr=document.getElementById("wr");
 if(wr){const up=()=>{let w=wr.value.trim().split(/\s+/).filter(Boolean);if(w.length>60){wr.value=w.slice(0,60).join(" ");w=w.slice(0,60)}S.w=wr.value;document.getElementById("wc").textContent=w.length+" / 60 words"};wr.oninput=up;up()}
 if(p=="speaking")setupSpeak();
}
function setupSpeak(){
 const rc=document.getElementById("rc"),st=document.getElementById("st"),rs=document.getElementById("rs"),
       live=document.getElementById("live"),tr=document.getElementById("tr"),dl=document.getElementById("dl"),alt=document.getElementById("alt"),nx=document.getElementById("nx");
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 let rec=null,stream=null,ac=null,enc=null,proc=null,mp3=[],mr=null,chunks=[],finished=false;
 const stopRec=()=>{if(rec){try{rec.stop()}catch(e){}}};
 const finalize=(blob,ext)=>{if(finished)return;finished=true;
  if(stream){try{stream.getTracks().forEach(t=>t.stop())}catch(e){}}stream=null;
  if(ac){try{ac.close()}catch(e){}}ac=null;
  const pl=document.getElementById("pl");if(pl&&blob&&blob.size>0){const url=URL.createObjectURL(blob);pl.src=url;pl.hidden=false;dl.href=url;dl.setAttribute("download","speaking-"+S.name.replace(/\s+/g,"_")+"."+ext);dl.hidden=false;}
  S.rec=true;rs.textContent="Recording saved. You can listen to it or download it.";st.disabled=true;
  if(tr){tr.hidden=false;tr.textContent=S.speech||"(no speech detected)";}};
 const typeFallback=()=>{alt.hidden=false;alt.oninput=e=>S.speech=e.target.value;rs.textContent="Type your answer in the box below.";rc.disabled=true;live.hidden=true};
 const stopMp3=()=>{stopRec();
  if(proc){try{proc.disconnect()}catch(e){};proc.onaudioprocess=null;proc=null;}
  if(enc){try{const f=enc.flush();if(f.length>0)mp3.push(new Int8Array(f));}catch(e){}enc=null;}
  finalize(new Blob(mp3,{type:"audio/mp3"}),"mp3");mp3=[];};
 const stopAll=()=>{stopRec();
  if(proc){try{proc.disconnect()}catch(e){}}proc=null;
  if(mr&&mr.state=="recording"){try{mr.stop()}catch(e){}}
  if(stream){try{stream.getTracks().forEach(t=>t.stop())}catch(e){}}stream=null;
  if(ac){try{ac.close()}catch(e){}}ac=null;};
 S.cleanup=stopAll;
 nx.onclick=()=>{stopAll();next();};
 rc.onclick=async()=>{
  rc.disabled=true;let n=15;rs.textContent="Get ready… "+n;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){return typeFallback();}
  if(SR){try{
    rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang="en-US";
    let finalText="";
    rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){finalText+=r[0].transcript+" ";}else{interim+=r[0].transcript;}}S.speech=finalText.trim();live.textContent="You said: "+(finalText+interim).trim();};
    rec.onerror=()=>{};rec.onend=()=>{};
  }catch(e){rec=null;}}
  const c=setInterval(()=>{n--;rs.textContent="Get ready… "+n;if(n<=0){clearInterval(c);startCap();}},1000);
 };
 function startCap(){
  if(window.lamejs){
   ac=new (window.AudioContext||window.webkitAudioContext)();
   const src=ac.createMediaStreamSource(stream);
   proc=ac.createScriptProcessor(4096,1,1);
   enc=new lamejs.Mp3Encoder(1,ac.sampleRate,128);mp3=[];
   proc.onaudioprocess=e=>{const b=e.inputBuffer.getChannelData(0);const i16=new Int16Array(b.length);for(let i=0;i<b.length;i++){let s=b[i];s=s<-1?-1:(s>1?1:s);i16[i]=s<0?s*0x8000:s*0x7FFF;}const d=enc.encodeBuffer(i16);if(d.length>0)mp3.push(new Int8Array(d));};
   src.connect(proc);proc.connect(ac.destination);
   st.onclick=stopMp3;
   setTimeout(()=>{if(proc)stopMp3();},45000);
  }else{
   chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=e=>chunks.push(e.data);
   mr.onstop=()=>{const mt=mr.mimeType||"audio/webm";finalize(new Blob(chunks,{type:mt}),(mt.indexOf("mp4")>=0?"m4a":"webm"));};
   mr.start();
   st.onclick=()=>{stopRec();mr.stop();};
   setTimeout(()=>{if(mr&&mr.state=="recording"){stopRec();mr.stop();}},45000);
  }
  if(rec){try{rec.start()}catch(e){}}
  st.disabled=false;rs.textContent="Recording… speak now (45 seconds maximum)";
 }
}
render();
</script></body></html>
